name: Submission Star Reminder

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['packages/**/*.json']
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open submission PR to recheck after its author stars the repository'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: submission-star-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  reminder:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This job can comment on fork PRs. Only load trusted default-branch code;
      # never check out a contributor's branch or execute submitted packages.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const remind = require('./scripts/pr-star-reminder.cjs');
            await remind({ github, context, core });
